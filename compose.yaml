# Local services for development and integration tests.
# Both bind to 127.0.0.1 only, so nothing is reachable from the network.
# The Postgres password is a local development value, not a secret.
name: briefing-engine

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: briefing
      POSTGRES_PASSWORD: briefing
      POSTGRES_DB: briefing
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefing -d briefing"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email sent to localhost:1025 and shows it at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    environment:
      # Mailpit looks up the client's hostname before greeting it. Inside Docker Desktop
      # that lookup times out, which made every send take 8 seconds.
      MP_SMTP_DISABLE_RDNS: "true"
      # Keep the inbox on a volume, so recreating the container doesn't empty it.
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit:/data
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
  mailpit:
