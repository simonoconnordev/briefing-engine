name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: briefing
          POSTGRES_PASSWORD: briefing
          POSTGRES_DB: briefing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U briefing -d briefing"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://briefing:briefing@127.0.0.1:5432/briefing_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint and format
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Types
        run: uv run mypy
      - name: Tests (unit and integration against Postgres 17)
        run: uv run pytest
