# For running Alembic by hand (`uv run alembic history`, `uv run alembic revision -m ...`).
# `briefing migrate` configures Alembic in code and doesn't read this file.
# The database URL comes from DATABASE_URL in .env (see migrations/env.py).
[alembic]
script_location = src/briefing_engine/db/migrations
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
