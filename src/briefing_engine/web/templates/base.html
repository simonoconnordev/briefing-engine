<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}briefing-engine{% endblock %}</title>
<style>
:root {
  --bg: #f4f3ef; --card: #ffffff; --ink: #1d1c1a; --muted: #6b675f; --line: #dcd8cf;
  --link: #1a4d8f; --yes: #1b7f61; --yes-bg: #e3f3ec; --no: #9a3d1d; --no-bg: #f8e8e1;
  --chip: #ebe8e0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17171a; --card: #202024; --ink: #ecebe6; --muted: #a29e95; --line: #34343a;
    --link: #8fb4ff; --yes: #5fd0a6; --yes-bg: #1c3a30; --no: #f0a080; --no-bg: #44281e;
    --chip: #2c2c31;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 16px/1.55 system-ui, "Segoe UI", sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
nav a { padding: 6px 12px; border-radius: 999px; color: var(--ink); text-decoration: none;
        background: var(--chip); font-size: 14px; }
nav a.on { background: var(--ink); color: var(--bg); }
h1 { font-size: 24px; margin: 0 0 4px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
        padding: 14px 16px; margin-bottom: 12px; scroll-margin-top: 12px; }
.item.interesting { border-color: var(--yes); }
.item.not_for_me { border-color: var(--no); opacity: 0.85; }
.meta { color: var(--muted); font-size: 13px; margin: 0 0 4px; }
.item h2 { font-size: 18px; margin: 0 0 6px; line-height: 1.3; }
.item h2 a { color: var(--link); text-decoration: none; }
.item h2 a:hover { text-decoration: underline; }
.excerpt { margin: 0 0 8px; font-size: 15px; color: var(--ink); }
.reason { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
.score { display: inline-block; padding: 0 6px; border-radius: 4px; background: var(--chip);
         font-weight: 600; color: var(--ink); }
form.mark { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
form.mark input[type=text] { flex: 1 1 220px; min-width: 0; padding: 7px 9px; font: inherit;
         font-size: 14px; border: 1px solid var(--line); border-radius: 6px;
         background: var(--bg); color: var(--ink); }
button { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 6px; cursor: pointer;
         border: 1px solid var(--line); background: var(--card); color: var(--ink); }
button.yes { border-color: var(--yes); color: var(--yes); }
button.no { border-color: var(--no); color: var(--no); }
button.yes.on { background: var(--yes-bg); font-weight: 600; }
button.no.on { background: var(--no-bg); font-weight: 600; }
button:focus-visible, nav a:focus-visible, input:focus-visible { outline: 2px solid var(--link);
         outline-offset: 2px; }
table { width: 100%; border-collapse: collapse; background: var(--card); font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase;
     letter-spacing: 0.06em; }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.empty { color: var(--muted); padding: 24px 0; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; font-size: 14px; }
.pills a { color: var(--link); }
</style>
</head>
<body>
<div class="wrap">
<nav>
  <a href="/" class="{{ 'on' if tab == 'briefing' else '' }}">Latest briefing</a>
  <a href="/review" class="{{ 'on' if tab == 'review' else '' }}">Review</a>
  <a href="/report" class="{{ 'on' if tab == 'report' else '' }}">Feeds report</a>
</nav>
{% block body %}{% endblock %}
</div>
</body>
</html>
