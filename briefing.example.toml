# Copy to briefing.toml (ignored by git) and run `briefing load-config`.
# Five feeds and one profile: three that carry whole posts, the Hugging Face blog (titles
# only) and Show HN. Add feeds one at a time and judge each by its hit rate (`briefing report`).

[user]
email = "you@example.com"          # Mailpit catches everything locally, so any address works
display_name = "Simon"
timezone = "Europe/Dublin"
send_time = "06:30"

[[profiles]]
name = "ai-news"
threshold = 6.0
max_items = 8
max_age_days = 7                   # older posts are neither scored nor sent

# Aim: output that is relevant and interesting to me, about AI tools, developments and
# practical uses. This is a starting point; marking items "interesting" or "not for me"
# is what should reshape it.
[profiles.rubric]
description = """\
A reader who wants a short daily briefing on AI: tools, developments and practical uses \
that are worth their time. Most valued: things people have actually built or tried, with \
enough detail to learn from or try; useful ways to work, research, write, learn or create \
with AI; open-source releases and tools they could use today; and developments that change \
what is possible or how people use AI. Industry news matters only when it changes what \
people can build or do. The item must be primarily about AI, machine learning or LLMs: \
items not about AI score at most 3, and items that only mention AI in passing score at most 4."""
avoid = [
    "funding rounds, valuations, acquisitions, revenue and hiring news",
    "lab politics, executive moves, lawsuits, policy and regulation, unless they directly change what people can build or do",
    "benchmark disputes, capability forecasts and speculation about future models",
    "routine product updates and announcements of plans with nothing to try yet",
    "memes, complaints without information, spam and purely promotional posts",
]
scale_hint = """\
9-10 must see: a development that changes what people can do with AI, or an exceptional \
hands-on write-up or tool. 7-8 high value: a genuinely useful or novel tool, technique or \
release, a strong how-I-built-it or how-I-use-it post, or a clear explanation of an \
important development. 5-6 worth a look: a promising smaller project, a useful tip, an \
interesting demo or idea. 3-4 low priority: business news, policy, forecasts, thin \
launches. 0-2 noise."""

[[profiles.rubric.interests]]
topic = "hands-on accounts of building or using AI tools, with concrete details of what worked, what it cost or what went wrong"
weight = 3

[[profiles.rubric.interests]]
topic = "practical ways to work, research, write, learn or create with AI that a person could adopt"
weight = 3

[[profiles.rubric.interests]]
topic = "new or notable AI tools, apps, open-source releases and repositories someone could try today"
weight = 3

[[profiles.rubric.interests]]
topic = "developments in models and AI products that change what people can do, explained clearly"
weight = 2

[[profiles.rubric.interests]]
topic = "techniques and patterns for building with LLMs and agents"
weight = 2

[[sources]]
name = "Simon Willison"
url = "https://simonwillison.net/atom/everything/"
kind = "atom"
profiles = ["ai-news"]

[[sources]]
name = "One Useful Thing (Ethan Mollick)"
url = "https://www.oneusefulthing.org/feed"
kind = "rss"
profiles = ["ai-news"]

[[sources]]
name = "Latent Space"
url = "https://www.latent.space/feed"
kind = "rss"
profiles = ["ai-news"]
exclude_categories = ["AINews: Weekday Roundups"]   # its daily news digest

[[sources]]
name = "Hugging Face blog"
url = "https://huggingface.co/blog/feed.xml"
kind = "rss"
profiles = ["ai-news"]
# Titles only: the feed carries no summaries, so these are scored on the title alone.

[[sources]]
name = "Show HN (100+ points)"
url = "https://hnrss.org/show?points=100"
kind = "rss"
profiles = ["ai-news"]
# Things people built, with the poster's own description. Most aren't about AI, and the
# rubric scores those down.