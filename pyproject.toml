[project]
name = "briefing-engine"
version = "0.1.0"
description = "Fetches news feeds, scores articles against a reader's rubric with Claude, and emails a daily briefing."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "anthropic>=1.0",
    "fastapi>=0.115",
    "feedparser>=6.0.11",
    "httpx>=0.28",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.2.10",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.41",
    "uvicorn>=0.35",
]

[project.scripts]
briefing = "briefing_engine.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.135",
    "mypy>=1.17",
    "pre-commit>=4.2",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/briefing_engine"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Unicode lookalikes are deliberate: the text-canonicalisation docs and tests use them.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["briefing_engine"]

[[tool.mypy.overrides]]
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs the local Postgres from compose.yaml",
]
